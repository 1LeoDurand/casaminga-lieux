name: Import hebdomadaire - sources d'evenements

# Relance hebdomadaire des imports d'evenements (tache D9 / T8, P5).
# Lundi 05h00 heure de Paris, ou a la main (workflow_dispatch, parametre `essai`).
#
# Jobs (les 3 imports tournent en parallele, ils ecrivent des sources distinctes) :
#   garde        -> decide si on tourne (heure de Paris) et le mode essai/reel
#   openagenda   -> rapprochement annuaire x OpenAgenda, liste blanche, Herault
#                   puis departements couverts          (plafond 300 par appel)
#   sites        -> moissonneur de sites                 (plafond 300)
#   datatourisme -> Herault (34) puis les 12 autres departements d'Occitanie
#                   (plafond 1 000 par appel)
#   suite        -> import-region-occitanie.py s'il existe, recuperation des
#                   affiches, mesure-import.py (rapports en artefact)
# Duree maximale cumulee (timeouts) : garde 5 + max(30, 35, 30) + suite 35 =
# 75 min au pire, sous les 90 min visees. Estimation courante : 40 a 50 min.
#
# Chaque etape est en continue-on-error et ecrit un journal logs/<etape>.txt,
# envoye en artefact. Ce workflow N'ECRIT JAMAIS dans git (ni commit ni push) et
# n'appelle pas deploy.yml.
#
# Suite T8.1 (non implementee, demande une colonne) : marquer « annulee a la
# source » une fiche disparue apres deux relances (regle R12).

on:
  schedule:
    # Deux cron pour suivre l'heure de Paris : 03h UTC = 05h CEST (ete),
    # 04h UTC = 05h CET (hiver). Le job `garde` ne laisse passer que celui
    # qui tombe vers 5 h a Paris (5 h ou 6 h si GitHub retarde).
    - cron: "0 3 * * 1"
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : passe --essai partout, rien n'est ecrit"
        type: boolean
        required: true
        default: true

concurrency:
  group: import-hebdo
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8
  # Departements OpenAgenda deja couverts (Herault traite a part, en premier).
  # Surchargeable dans Settings > Variables (OPENAGENDA_DEPARTEMENTS), separes
  # par des espaces. Valeur par defaut a confirmer par Leo.
  # Vide par defaut : hors Herault, OpenAgenda n'est lu que par la liste
  # blanche de l'annuaire (les autres departements en base en viennent).
  OPENAGENDA_DEPARTEMENTS: ${{ vars.OPENAGENDA_DEPARTEMENTS || '' }}
  OCCITANIE_AUTRES: "09 11 12 30 31 32 46 48 65 66 81 82"

jobs:
  garde:
    name: Garde (heure et mode)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.g.outputs.go }}
      essai: ${{ steps.g.outputs.essai }}
    steps:
      - id: g
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "essai=${{ inputs.essai }}" >> "$GITHUB_OUTPUT"
          else
            h=$(TZ=Europe/Paris date +%H)
            if [ "$h" = "05" ] || [ "$h" = "06" ]; then
              echo "go=true" >> "$GITHUB_OUTPUT"
            else
              echo "go=false" >> "$GITHUB_OUTPUT"
            fi
            echo "essai=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Secrets presents (valeurs non affichees)
        if: steps.g.outputs.go == 'true'
        run: |
          manquants=""
          [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] && manquants="$manquants NEXT_PUBLIC_SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && manquants="$manquants SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$manquants" ]; then
            echo "::error::Secret(s) manquant(s) :$manquants (Settings > Secrets and variables > Actions, voir docs/IMPORT-HEBDO.md)"
            exit 1
          fi
          echo "Secrets presents."

  openagenda:
    name: OpenAgenda
    needs: garde
    if: needs.garde.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ESSAI: ${{ needs.garde.outputs.essai }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check --quiet certifi
      - run: mkdir -p logs
      - name: Rapprochement annuaire x OpenAgenda (liste blanche)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          # La liste blanche est regeneree dans la copie du runner, jamais commitee.
          python -u scripts/rapprocher-annuaire-openagenda.py 2>&1 | tee logs/openagenda-rapprochement.txt
      - name: Import OpenAgenda par liste blanche (300)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          E=""; [ "$ESSAI" = "true" ] && E="--essai"
          python -u scripts/import-openagenda.py --lieux scripts/data/lieux-annuaire-openagenda.json --max 300 $E 2>&1 | tee logs/openagenda-lieux.txt
      - name: Import OpenAgenda Herault (34), plafond 300
        continue-on-error: true
        timeout-minutes: 6
        run: |
          E=""; [ "$ESSAI" = "true" ] && E="--essai"
          python -u scripts/import-openagenda.py --departement 34 --max 300 $E 2>&1 | tee logs/openagenda-34.txt
      - name: Import OpenAgenda departements couverts, plafond 300 chacun
        continue-on-error: true
        timeout-minutes: 10
        run: |
          E=""; [ "$ESSAI" = "true" ] && E="--essai"
          rc=0
          for d in $OPENAGENDA_DEPARTEMENTS; do
            echo "=== departement $d" | tee -a logs/openagenda-departements.txt
            python -u scripts/import-openagenda.py --departement "$d" --max 300 $E 2>&1 | tee -a logs/openagenda-departements.txt || rc=1
          done
          exit $rc
      - name: Resume
        if: always()
        run: |
          { echo "## OpenAgenda (essai=$ESSAI)"; for f in logs/*.txt; do echo "### $f"; echo '```'; tail -n 25 "$f"; echo '```'; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journaux-openagenda
          path: logs/
          if-no-files-found: ignore

  sites:
    name: Moissonneur de sites
    needs: garde
    if: needs.garde.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ESSAI: ${{ needs.garde.outputs.essai }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check --quiet certifi
      - run: mkdir -p logs
      - name: Import sites, plafond 300 (sites en pause sautes par le script)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          # Sans --resonder-tout : le script saute les sites sondes il y a moins
          # de 90 jours sans signal (memoire annuaire_sites_sondes).
          E=""; [ "$ESSAI" = "true" ] && E="--essai"
          python -u scripts/import-sites.py --max 300 $E 2>&1 | tee logs/sites.txt
      - name: Resume
        if: always()
        run: |
          { echo "## Sites (essai=$ESSAI)"; echo '```'; tail -n 30 logs/sites.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journaux-sites
          path: logs/
          if-no-files-found: ignore

  datatourisme:
    name: DATAtourisme Occitanie
    needs: garde
    if: needs.garde.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ESSAI: ${{ needs.garde.outputs.essai }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check --quiet certifi
      - run: mkdir -p logs
      - name: DATAtourisme Herault (34), plafond 1000
        continue-on-error: true
        timeout-minutes: 12
        run: |
          E=""; [ "$ESSAI" = "true" ] && E="--essai"
          python -u scripts/import-datatourisme.py --departement 34 --max 1000 $E 2>&1 | tee logs/datatourisme-34.txt
      - name: DATAtourisme 12 autres departements d'Occitanie, plafond 1000
        continue-on-error: true
        timeout-minutes: 12
        run: |
          # Un seul appel : le CSV national n'est telecharge qu'une fois par appel
          # et reste en cache dans le runner pour le second.
          E=""; [ "$ESSAI" = "true" ] && E="--essai"
          python -u scripts/import-datatourisme.py --departement "$(echo $OCCITANIE_AUTRES | tr ' ' ',')" --max 1000 $E 2>&1 | tee logs/datatourisme-occitanie.txt
      - name: Resume
        if: always()
        run: |
          { echo "## DATAtourisme (essai=$ESSAI)"; for f in logs/*.txt; do echo "### $f"; echo '```'; tail -n 25 "$f"; echo '```'; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journaux-datatourisme
          path: logs/
          if-no-files-found: ignore

  suite:
    name: Region, affiches, mesure
    needs: [garde, openagenda, sites, datatourisme]
    # tourne meme si un import a echoue
    if: always() && needs.garde.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ESSAI: ${{ needs.garde.outputs.essai }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check --quiet certifi pillow
      - run: mkdir -p logs rapports
      - name: Import region Occitanie (si le script existe), plafond 1000
        continue-on-error: true
        timeout-minutes: 12
        run: |
          E=""; [ "$ESSAI" = "true" ] && E="--essai"
          if [ -f scripts/import-region-occitanie.py ]; then
            python -u scripts/import-region-occitanie.py --max 1000 $E 2>&1 | tee logs/region-occitanie.txt
          else
            echo "scripts/import-region-occitanie.py absent : etape sautee." | tee logs/region-occitanie.txt
          fi
      - name: Recuperer les affiches (toutes sources)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          # La memoire des refus (scripts/data/affiches-importees.json) n'existe que
          # dans la copie du runner : les refus ne sont pas retenus d'une semaine a l'autre.
          E=""; [ "$ESSAI" = "true" ] && E="--essai"
          python -u scripts/recuperer-affiches.py --source toutes --max 300 $E 2>&1 | tee logs/affiches.txt
      - name: Mesure de l'import (rapports en artefact)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # Le script ecrit dans un dossier de rapports : on lui en fournit un
          # dans le runner, avec les deux fichiers a marqueurs qu'il remplace.
          printf '<!-- RESULTATS:debut -->\n<!-- RESULTATS:fin -->\n' > rapports/06-RESULTATS.md
          printf '<!-- MESURES:debut -->\n<!-- MESURES:fin -->\n' > rapports/00-DASHBOARD.md
          E=""; [ "$ESSAI" = "true" ] && E="--essai"
          python -u scripts/mesure-import.py --dossier rapports $E 2>&1 | tee logs/mesure.txt
      - name: Resume
        if: always()
        run: |
          { echo "## Suite (essai=$ESSAI)"; for f in logs/*.txt; do echo "### $f"; echo '```'; tail -n 25 "$f"; echo '```'; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journaux-suite-et-rapports
          path: |
            logs/
            rapports/
          if-no-files-found: ignore
